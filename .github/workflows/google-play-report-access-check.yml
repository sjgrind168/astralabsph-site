name: AstraLabs Google Play verified bucket access
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WIF_PROVIDER }}
          service_account: astralabs-reports-readonly@astralabsph-play-backend.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install 'google-cloud-storage>=2.18,<4'
      - name: Verify configured Google Play reports bucket (fail closed)
        env:
          BUCKET: ${{ vars.GOOGLE_PLAY_REPORT_BUCKET }}
        run: |
          python - <<'PY'
          import os
          import sys
          from google.cloud import storage
          from google.api_core.exceptions import GoogleAPICallError
          
          bucket = os.environ.get("BUCKET", "").strip()
          if not bucket:
              print("ACCESS_CHECK_FAILED missing configured report bucket")
              sys.exit(1)
          
          client = storage.Client()
          first_object = None
          list_errors = 0
          for prefix in ("stats/installs/", "sales/", "earnings/"):
              try:
                  obj = next(iter(client.list_blobs(bucket, prefix=prefix, max_results=1)), None)
                  print("BUCKET_DIAG", prefix, "LIST_OK", int(obj is not None))
                  if obj is not None and first_object is None:
                      first_object = obj
              except GoogleAPICallError as exc:
                  print("BUCKET_DIAG", prefix, "LIST_ERROR", getattr(exc, "code", "unknown"))
                  list_errors += 1
          
          if list_errors:
              print("ACCESS_CHECK_FAILED", "list_errors", list_errors)
              sys.exit(1)
          if first_object is None:
              print("ACCESS_CHECK_INCONCLUSIVE no existing reports in expected prefixes")
              sys.exit(1)
          
          try:
              data = first_object.download_as_bytes(start=0, end=0, timeout=25)
              print("ACCESS_CHECK_OK", "existing_report_range_bytes", len(data))
          except GoogleAPICallError as exc:
              print("ACCESS_CHECK_FAILED", "object_read_error", getattr(exc, "code", "unknown"))
              sys.exit(1)
          PY
