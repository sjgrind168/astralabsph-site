name: AstraLabs Google Play verified bucket access
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WIF_PROVIDER }}
          service_account: astralabs-reports-readonly@astralabsph-play-backend.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install 'google-cloud-storage>=2.18,<4'
      - name: Verify official reports bucket lists accessible objects
        env:
          BUCKET: ${{ vars.GOOGLE_PLAY_REPORT_BUCKET }}
        run: |
          python - <<'PY'
          import os
          from google.cloud import storage
          from google.api_core.exceptions import GoogleAPICallError
          original=os.environ['BUCKET']
          candidates=[original]
          if original.startswith('pubsite_prod_') and not original.startswith('pubsite_prod_rev_'):
              candidates.append(original.replace('pubsite_prod_','pubsite_prod_rev_',1))
          client=storage.Client()
          for bucket in candidates:
              for prefix in ('stats/installs/','sales/','earnings/'):
                  try:
                      objects=list(client.list_blobs(bucket,prefix=prefix,max_results=2))
                      print('BUCKET_DIAG',bucket,prefix,'LIST_OK',len(objects))
                      for o in objects: print('OBJECT_PREFIX_SAMPLE',o.name[:90])
                  except GoogleAPICallError as exc:
                      print('BUCKET_DIAG',bucket,prefix,'LIST_ERROR',getattr(exc,'code','unknown'))
              name='stats/installs/installs_com.astralabs.astramate_202609_country.csv'
              try:
                  b=client.bucket(bucket).blob(name).download_as_bytes(timeout=25)
                  print('BUCKET_PROBE_OBJECT_READ_OK',bucket,'BYTES',len(b))
              except GoogleAPICallError as exc:
                  print('BUCKET_PROBE_OBJECT_READ_ERROR',bucket,getattr(exc,'code','unknown'))
          PY
