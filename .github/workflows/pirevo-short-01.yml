name: PIREVO Short 01 Voice Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pirevo-short-01.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirevo-short-01-build
  cancel-in-progress: true

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download HeyGen voiceover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2             'https://resource2.heygen.ai/text_to_speech/38b4b240c4ef42aa82bff7a8209dfa31/04cfb01cb3a845c2af192666c417d1ed/id=474c71ba-eaf4-4756-975c-8736360163ab.wav'             -o out/pirevo-heygen-voice-01.wav
          test -s out/pirevo-heygen-voice-01.wav
          file out/pirevo-heygen-voice-01.wav

      - name: Upload HeyGen voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: pirevo-heygen-voice-01
          path: out/pirevo-heygen-voice-01.wav
          if-no-files-found: error
          retention-days: 7
