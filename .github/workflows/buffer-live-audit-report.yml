name: Buffer Live Audit Report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffer-live-audit-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ASTRALABS_BUFFER_API_KEY: ${{ secrets.ASTRALABS_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Buffer channels and today's post states
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from pathlib import Path

          API="https://api.buffer.com"
          PHT=ZoneInfo("Asia/Manila")
          key=os.environ.get("ASTRALABS_BUFFER_API_KEY","").strip()
          if not key:
              raise SystemExit("BUFFER_LIVE_AUDIT_FAIL missing secret")

          def q(v):
              return json.dumps(str(v), ensure_ascii=True)

          def gql(query):
              req=urllib.request.Request(
                  API,
                  data=json.dumps({"query":query}).encode(),
                  headers={
                      "Authorization":"Bearer "+key,
                      "Content-Type":"application/json",
                      "User-Agent":"AstraLabs-Buffer-Live-Audit/1.0"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=json.load(r)
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"BUFFER_LIVE_AUDIT_FAIL http={e.code}")
              if payload.get("errors"):
                  raise SystemExit("BUFFER_LIVE_AUDIT_FAIL graphql="+json.dumps(payload["errors"])[:1000])
              data=payload.get("data")
              if not isinstance(data,dict):
                  raise SystemExit("BUFFER_LIVE_AUDIT_FAIL missing data")
              return data

          acct=gql("query { account { organizations { id name } } }").get("account") or {}
          orgs=acct.get("organizations") or []
          if len(orgs)!=1:
              raise SystemExit("BUFFER_LIVE_AUDIT_FAIL organization count="+str(len(orgs)))
          org=orgs[0]

          channels=gql(
              "query { channels(input:{organizationId:"+q(org["id"])+
              "}) { id service isDisconnected isLocked isQueuePaused } }"
          ).get("channels") or []

          today=datetime.now(PHT).date()

          def parse_dt(v):
              if not v: return None
              try:
                  return datetime.fromisoformat(v.replace("Z","+00:00")).astimezone(PHT)
              except Exception:
                  return None

          def mini(x):
              t=(x.get("text") or "").replace("\n"," ").strip()
              return {
                  "id":x.get("id"),
                  "status":x.get("status"),
                  "dueAt":x.get("dueAt"),
                  "createdAt":x.get("createdAt"),
                  "externalLink":x.get("externalLink"),
                  "text":t[:280]
              }

          report={
              "generated_at_utc":datetime.now(timezone.utc).isoformat(),
              "generated_at_pht":datetime.now(PHT).isoformat(),
              "date_pht":today.isoformat(),
              "organization":org,
              "channels":[]
          }

          for ch in channels:
              cid=ch["id"]
              query=(
                  "query { posts(first:100,input:{organizationId:"+q(org["id"])+
                  ",filter:{status:[scheduled,sent,sending,draft,error],channelIds:["+q(cid)+
                  "]},sort:[{field:createdAt,direction:desc}]}) { edges { node { id text status dueAt createdAt channelId externalLink } } pageInfo { hasNextPage } } }"
              )
              p=gql(query).get("posts") or {}
              rows=[e.get("node") for e in (p.get("edges") or []) if isinstance(e.get("node"),dict)]
              today_rows=[]
              for x in rows:
                  dt=parse_dt(x.get("dueAt")) or parse_dt(x.get("createdAt"))
                  if dt and dt.date()==today:
                      today_rows.append(x)
              by_status={s:[mini(x) for x in today_rows if x.get("status")==s]
                         for s in ("sent","sending","scheduled","draft","error")}
              report["channels"].append({
                  "id":cid,
                  "service":ch.get("service"),
                  "isDisconnected":ch.get("isDisconnected"),
                  "isLocked":ch.get("isLocked"),
                  "isQueuePaused":ch.get("isQueuePaused"),
                  "today_counts":{k:len(v) for k,v in by_status.items()},
                  "today":by_status,
                  "latest_sent":mini(next((x for x in rows if x.get("status")=="sent"),{})) if any(x.get("status")=="sent" for x in rows) else None,
                  "scheduled_future":[mini(x) for x in rows if x.get("status")=="scheduled"][:20],
                  "has_more":bool((p.get("pageInfo") or {}).get("hasNextPage"))
              })

          out=Path("marketing/automation/shared/BUFFER_LIVE_AUDIT_20260930.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding="utf-8")
          print("BUFFER_LIVE_AUDIT_OK")
          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Persist live audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AstraLabs Buffer Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add marketing/automation/shared/BUFFER_LIVE_AUDIT_20260930.json
          if git diff --cached --quiet; then
            echo "NO_AUDIT_REPORT_CHANGE"
            exit 0
          fi
          git commit -m 'Marketing: record Buffer live audit 2026-09-30'
          git pull --rebase origin main
          git push origin HEAD:main

