name: PIREVO Pinterest Halloween Wave 3 Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pirevo-pinterest-halloween-wave3-assets.yml'
      - 'marketing/pirevo/render_pinterest_halloween_wave3.py'
      - 'marketing/pirevo/PINTEREST_PIN_COPY_HALLOWEEN_WAVE3_20261009.json'
      - 'public/pirevo/store-data.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pirevo-pinterest-halloween-wave3-assets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image renderer
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0

      - name: Render 16 premium Halloween Pins
        run: python marketing/pirevo/render_pinterest_halloween_wave3.py

      - name: Validate Halloween Wave 3 inventory
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find public/pirevo/assets/pins/wave3-halloween -maxdepth 1 -type f -name '[0-9][0-9]_*.jpg' | wc -l | tr -d ' ')"
          test "$COUNT" = "16"
          test -s public/pirevo/assets/pins/wave3-halloween/manifest.json
          test -s public/pirevo/assets/pins/wave3-halloween/QA_contact_sheet.jpg
          grep -q '"count": 16' public/pirevo/assets/pins/wave3-halloween/manifest.json
          echo "PIREVO_HALLOWEEN_WAVE3_ASSET_QA_OK count=$COUNT"

      - name: Persist Halloween Wave 3 assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AstraLabs PIREVO Asset Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/pirevo/assets/pins/wave3-halloween
          if git diff --cached --quiet; then
            echo "NO_HALLOWEEN_WAVE3_ASSET_CHANGE"
            exit 0
          fi
          git commit -m 'PIREVO: render Halloween Pinterest Wave 3 assets'
          git pull --rebase origin main
          git push origin HEAD:main
