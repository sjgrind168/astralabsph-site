name: RUDE Official Provider Metrics
on:
  workflow_dispatch:
  schedule:
    # Once daily, 11:37 Asia/Manila. Vendor financial reports can be delayed.
    - cron: '37 3 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: rude-official-provider-reports
  cancel-in-progress: false
jobs:
  verified-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUDE_PROVIDER_INGEST_TOKEN: ${{ secrets.RUDE_PROVIDER_INGEST_TOKEN }}
      # Apple canonical Sales ETL syncs straight from verified AstraLabs source into RUDE tables.
      GOOGLE_PLAY_SA_JSON_B64: ${{ secrets.GOOGLE_PLAY_SA_JSON_B64 }}
      GOOGLE_PLAY_REPORT_BUCKET: ${{ vars.GOOGLE_PLAY_REPORT_BUCKET }}
      GOOGLE_PLAY_ENABLE_VITALS: ${{ vars.GOOGLE_PLAY_ENABLE_VITALS }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtain short-lived Google credentials (GitHub OIDC)
        if: ${{ vars.GOOGLE_PLAY_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WIF_PROVIDER }}
          service_account: astralabs-reports-readonly@astralabsph-play-backend.iam.gserviceaccount.com
          create_credentials_file: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/rude-provider-sync/requirements.txt
      - name: Install source clients
        run: python -m pip install -r tools/rude-provider-sync/requirements.txt
      - name: Verify currency, refunds and app isolation
        run: python -m unittest discover -s tools/rude-provider-sync -p 'test_*.py' -v
      - name: Fetch official reports and ingest only verified source facts
        id: provider_import
        run: python tools/rude-provider-sync/sync.py
      - name: Record scheduled Google importer failure securely
        if: ${{ failure() && steps.provider_import.outcome == 'failure' }}
        env:
          INGEST_TOKEN: ${{ secrets.RUDE_PROVIDER_INGEST_TOKEN }}
          FAILURE_CODE: ${{ steps.provider_import.outputs.failure_code }}
        run: |
          if [ -n "$INGEST_TOKEN" ]; then
            curl --fail --silent --show-error --max-time 20 \
              -X POST 'https://cscqulbludoyzsgniits.supabase.co/functions/v1/rude-provider-ingest' \
              -H "Authorization: Bearer $INGEST_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"action\":\"failure\",\"provider\":\"google_play\",\"error_code\":\"${FAILURE_CODE:-google_play_ingest_error}\"}" || true
          fi