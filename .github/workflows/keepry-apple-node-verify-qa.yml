name: Keepry Apple verifier Node build QA
on:
  push:
    branches:
      - fix/keepry-apple-node-verifier-20260924
    paths:
      - package.json
      - package-lock.json
      - api/keepry-apple-verify.js
      - .github/workflows/keepry-apple-node-verify-qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve pinned official Apple package and lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact lockfile and inspect Node route
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --check api/keepry-apple-verify.js
          node -e "import('@apple/app-store-server-library').then(x=>{if(!x.SignedDataVerifier || !x.Environment)process.exit(1)})"
          npm run build
      - name: Commit lockfile only if regenerated
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update lockfile for isolated Keepry Apple Node verifier"
            git push
          fi
