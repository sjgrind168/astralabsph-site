name: AstraLabs Three Posts Daily Per App
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0,4,8 * * *' # 08:20, 12:20, 16:20 PHT. Max 2 confirmed new Buffer posts per run.
    - cron: '40 11 * * *'  # 19:40 PHT recovery window; never blind retry HTTP 429.
permissions:
  contents: read
concurrency:
  group: astralabs-facebook-buffer-queue
  cancel-in-progress: false
jobs:
  refill-approved-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ASTRALABS_DAILY_FB_PUBLISH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Queue maximum three unique Keepry and Astramate Facebook posts each local day
        env:
          ASTRALABS_BUFFER_API_KEY: ${{ secrets.ASTRALABS_BUFFER_API_KEY }}
        run: python3 marketing/automation/facebook/scripts/daily_two_per_app.py
