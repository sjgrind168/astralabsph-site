name: AstraLabs Pinterest Organic Queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astralabs-pinterest-queue.yml'
      - 'marketing/automation/pinterest/scripts/buffer_pinterest.py'
      - 'marketing/automation/pinterest/scripts/buffer_pinterest_content.json'
  schedule:
    - cron: '45 0 * * *'
permissions:
  contents: read
concurrency:
  group: astralabs-pinterest-apps-only
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ASTRALABS_PINTEREST_PUBLISH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Pinterest app board then queue a maximum of one approved first Pin
        env:
          ASTRALABS_BUFFER_API_KEY: ${{ secrets.ASTRALABS_BUFFER_API_KEY }}
        run: python3 marketing/automation/pinterest/scripts/buffer_pinterest.py
