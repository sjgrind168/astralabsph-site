name: AstraLabs Final Approved Two-Video Release 2026-09-26
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astralabs-final-approved-release-20260926.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astralabs-final-approved-release-20260926
  cancel-in-progress: false

jobs:
  publish-final-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRALABS_BUFFER_API_KEY: ${{ secrets.ASTRALABS_BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish final approved Astramate and Keepry videos once to Facebook and TikTok
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          API = "https://api.buffer.com"
          REPORT = Path("marketing/automation/shared/FINAL_APPROVED_RELEASE_STATUS_20260926.json")
          POSTS = [
            {
              "app": "Keepry",
              "url": "https://static.metricool.com/planner/202609/7092888-file-12583224503305168370.mp4",
              "text": "Important documents are easy to save, but easy to forget. Keep your records, important dates, and reminders together with Keepry. Available now on Google Play. https://www.astralabsph.com/ #Keepry #Productivity #LifeAdmin"
            },
            {
              "app": "Astramate",
              "url": "https://static.metricool.com/planner/202609/7092888-file-17971868690978037967.mp4",
              "text": "Need a quick check onboard? Astramate brings cargo, trim, stability, and practical maritime tools together in one app. Built for seafarers. Available now on Google Play. https://www.astralabsph.com/ #Astramate #Maritime #Seafarers"
            }
          ]
          results = []

          def q(v):
              return json.dumps(str(v), ensure_ascii=True)

          def gql(doc):
              token = os.environ.get("ASTRALABS_BUFFER_API_KEY", "").strip()
              if not token:
                  raise RuntimeError("Buffer secret missing")
              req = urllib.request.Request(
                  API,
                  data=json.dumps({"query": doc}).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "User-Agent": "AstraLabs-Final-Approved-Release/1.0"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      payload = json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError("Buffer HTTP " + str(e.code)) from None
              except urllib.error.URLError:
                  raise RuntimeError("Buffer network unavailable") from None
              if payload.get("errors") or not isinstance(payload.get("data"), dict):
                  raise RuntimeError("Buffer GraphQL rejected request")
              return payload["data"]

          def verify_mp4(url):
              req = urllib.request.Request(url, headers={"Range":"bytes=0-31","User-Agent":"AstraLabs-Final-Media-Proof/1.0"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  sig = r.read(32)
                  mime = (r.headers.get("Content-Type") or "").split(";")[0].lower()
                  if r.status not in (200,206) or len(sig) < 12 or sig[4:8] != b"ftyp" or mime not in ("video/mp4","application/octet-stream"):
                      raise RuntimeError("Final MP4 verification failed")

          orgs = ((gql("query { account { organizations { id name } } }").get("account") or {}).get("organizations") or [])
          if len(orgs) != 1:
              raise RuntimeError("Ambiguous Buffer organization")
          org = orgs[0]["id"]

          channels = gql("query { channels(input:{organizationId:" + q(org) + "}) { id name displayName service isDisconnected isLocked isQueuePaused } }").get("channels") or []

          def target(service):
              rows = [c for c in channels
                      if str(c.get("service","")).lower() == service
                      and "astralabs" in str(c.get("displayName") or c.get("name") or "").lower()]
              if len(rows) != 1:
                  raise RuntimeError("Expected exactly one AstraLabs " + service + " channel")
              c = rows[0]
              if c.get("isDisconnected") or c.get("isLocked") or c.get("isQueuePaused"):
                  raise RuntimeError(service + " channel unavailable/locked/paused")
              return c["id"]

          facebook = target("facebook")
          tiktok = target("tiktok")

          def history(channel_id):
              doc = ("query { posts(first:100,input:{organizationId:" + q(org) +
                     ",filter:{status:[scheduled,sent,sending,draft,error],channelIds:[" + q(channel_id) +
                     "]},sort:[{field:createdAt,direction:desc}]}) { edges { node { id text status channelId externalLink assets { mimeType source } } } pageInfo { hasNextPage } } }")
              node = gql(doc).get("posts")
              if not isinstance(node, dict) or not isinstance(node.get("edges"), list):
                  raise RuntimeError("Buffer history unavailable")
              if (node.get("pageInfo") or {}).get("hasNextPage"):
                  raise RuntimeError("Buffer history exceeds 100; fail closed")
              return [e["node"] for e in node["edges"] if isinstance(e.get("node"), dict)]

          def already(rows, item):
              return any(
                  str(r.get("text") or "") == item["text"] or
                  any(str(a.get("source") or "") == item["url"] for a in (r.get("assets") or []))
                  for r in rows
              )

          def create(channel_id, service, item):
              if service == "facebook":
                  meta = "metadata:{facebook:{type:post}}"
                  asset = "assets:[{video:{url:" + q(item["url"]) + "}}]"
              else:
                  meta = "metadata:{tiktok:{isAiGenerated:true}}"
                  asset = "assets:[{video:{url:" + q(item["url"]) + " metadata:{thumbnailOffset:2000}}}]"
              doc = ("mutation { createPost(input:{text:" + q(item["text"]) +
                     " channelId:" + q(channel_id) +
                     " schedulingType:automatic mode:shareNow aiAssisted:true " + meta + " " + asset +
                     "}) { ... on PostActionSuccess { post { id status schedulingType dueAt externalLink assets { mimeType source } } } ... on MutationError { message } } }")
              res = gql(doc).get("createPost") or {}
              post = res.get("post") if isinstance(res, dict) else None
              if not isinstance(post, dict) or not post.get("id"):
                  raise RuntimeError(service + " createPost failed for " + item["app"] + ": " + str(res.get("message","unknown"))[:140])
              return post

          def read_post(post_id):
              node = gql("query { post(input:{id:" + q(post_id) + "}) { id status externalLink error { message supportUrl } } }").get("post") or {}
              return {
                  "id": node.get("id"),
                  "status": node.get("status"),
                  "externalLink": node.get("externalLink"),
                  "error": ((node.get("error") or {}).get("message"))
              }

          for item in POSTS:
              verify_mp4(item["url"])

          for service, channel in [("facebook", facebook), ("tiktok", tiktok)]:
              rows = history(channel)
              for item in POSTS:
                  if already(rows, item):
                      found = next((r for r in rows if str(r.get("text") or "") == item["text"] or any(str(a.get("source") or "") == item["url"] for a in (r.get("assets") or []))), {})
                      results.append({
                          "service":service,"app":item["app"],"action":"deduped",
                          "status":found.get("status"),"post_id":found.get("id"),
                          "externalLink":found.get("externalLink")
                      })
                      print("BUFFER_DEDUPED", service, item["app"], flush=True)
                      continue

                  latest = history(channel)
                  if already(latest, item):
                      found = next((r for r in latest if str(r.get("text") or "") == item["text"] or any(str(a.get("source") or "") == item["url"] for a in (r.get("assets") or []))), {})
                      results.append({
                          "service":service,"app":item["app"],"action":"race_deduped",
                          "status":found.get("status"),"post_id":found.get("id"),
                          "externalLink":found.get("externalLink")
                      })
                      continue

                  post = create(channel, service, item)
                  print("BUFFER_CREATED", service, item["app"], "status", post.get("status"), "post", post["id"], flush=True)
                  time.sleep(6)
                  state = read_post(post["id"])
                  results.append({
                      "service":service,"app":item["app"],"action":"created",
                      "status":state.get("status"),"post_id":state.get("id"),
                      "externalLink":state.get("externalLink"),"error":state.get("error")
                  })
                  rows = latest + [{
                      "id": post["id"], "text": item["text"], "status": state.get("status"),
                      "assets": post.get("assets") or [], "externalLink": state.get("externalLink")
                  }]
                  time.sleep(1)

          REPORT.parent.mkdir(parents=True, exist_ok=True)
          REPORT.write_text(json.dumps({
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "release": "FINAL_APPROVED_20260926",
              "results": results
          }, indent=2), encoding="utf-8")
          print("BUFFER_FINAL_RELEASE_COMPLETE", flush=True)
          PY

      - name: Persist Buffer release proof
        shell: bash
        run: |
          git config user.name 'AstraLabs Marketing Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add marketing/automation/shared/FINAL_APPROVED_RELEASE_STATUS_20260926.json
          if git diff --cached --quiet; then
            echo "NO_REPORT_CHANGE"
            exit 0
          fi
          git commit -m 'Marketing: record final approved Buffer release status'
          git pull --rebase origin main
          git push origin HEAD:main
