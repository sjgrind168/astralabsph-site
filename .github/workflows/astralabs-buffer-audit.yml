name: AstraLabs Buffer Connection Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astralabs-buffer-audit.yml'
      - 'marketing/buffer_audit.py'
      - 'marketing/verify_pin_assets.py'
permissions:
  contents: read
jobs:
  verify-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Buffer channel check
        env:
          ASTRALABS_BUFFER_API_KEY: ${{ secrets.ASTRALABS_BUFFER_API_KEY }}
        run: python3 marketing/buffer_audit.py
      - name: Verify live organic Pinterest image URLs
        run: python3 marketing/verify_pin_assets.py
