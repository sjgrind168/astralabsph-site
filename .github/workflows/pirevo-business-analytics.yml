name: PIREVO Business Analytics

on:
  schedule:
    # 07:30 Asia/Manila = 23:30 UTC previous calendar day
    - cron: "30 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - "marketing/pirevo/pirevo_business_analytics.py"
      - ".github/workflows/pirevo-business-analytics.yml"
      - "public/pirevo/config.js"
      - "public/pirevo/business-analytics.js"

permissions:
  contents: write

concurrency:
  group: pirevo-business-analytics
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIREVO_GA4_PROPERTY_ID: ${{ vars.PIREVO_GA4_PROPERTY_ID || secrets.PIREVO_GA4_PROPERTY_ID }}
      PIREVO_GSC_SITE_URL: ${{ vars.PIREVO_GSC_SITE_URL || secrets.PIREVO_GSC_SITE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics clients
        run: |
          python -m pip install --disable-pip-version-check --quiet             google-analytics-data             google-api-python-client             google-auth

      - name: Build PIREVO business report
        run: python marketing/pirevo/pirevo_business_analytics.py

      - name: Commit report when changed
        run: |
          git config user.name "PIREVO Analytics Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marketing/pirevo/analytics/
          if git diff --cached --quiet; then
            echo "No analytics report changes."
            exit 0
          fi
          git commit -m "Update PIREVO business analytics report"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pirevo-business-analytics
          path: marketing/pirevo/analytics/
          retention-days: 30
