name: PIREVO Christmas Social Videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pirevo-christmas-social-videos.yml'
      - 'marketing/pirevo/render_christmas_social_videos.py'
      - 'public/pirevo/assets/pins/wave4-christmas/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pirevo-christmas-social-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0
      - name: Render 5 vertical Christmas social videos
        run: python marketing/pirevo/render_christmas_social_videos.py
      - name: Validate social videos
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find public/pirevo/assets/social/christmas-wave4 -maxdepth 1 -type f -name '*.mp4' | wc -l | tr -d ' ')"
          test "$COUNT" = "5"
          for f in public/pirevo/assets/social/christmas-wave4/*.mp4; do
            test -s "$f"
            ffprobe -v error -show_entries stream=width,height -of csv=s=x:p=0 "$f" | grep -q '^1080x1920$'
          done
          echo "PIREVO_CHRISTMAS_SOCIAL_VIDEO_QA_OK count=$COUNT"
      - name: Persist Christmas social videos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AstraLabs PIREVO Social Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/pirevo/assets/social/christmas-wave4
          if git diff --cached --quiet; then
            echo "NO_CHRISTMAS_VIDEO_CHANGE"
            exit 0
          fi
          git commit -m 'PIREVO: render Christmas social videos'
          git pull --rebase origin main
          git push origin HEAD:main
