name: AstraLabs TikTok Video Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astralabs-tiktok-video.yml'
      - 'marketing/automation/tiktok/scripts/buffer_tiktok.py'
      - 'marketing/automation/tiktok/scripts/buffer_tiktok_content.json'
  schedule:
    - cron: '25 0 * * *'
permissions:
  contents: read
concurrency:
  group: astralabs-tiktok-video-first-proof
  cancel-in-progress: false
jobs:
  check-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ASTRALABS_TIKTOK_PUBLISH_ENABLED: 'false' # First Astramate video already queued; await confirmed public TikTok publication.
    steps:
      - uses: actions/checkout@v4
      - name: Verify publicly hosted Astramate and Keepry videos and campaign images
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          paths = [
            ('astramate_mp4', 'marketing/videos/astramate_16sec_vertical_motion_ad.mp4', b'ftyp'),
            ('keepry_mp4', 'marketing/videos/keepry_16sec_vertical_motion_ad.mp4', b'ftyp'),
            ('astramate_png', 'marketing/campaigns/facebook/A01_astramate_facebook_4x5.png', b'\x89PNG'),
            ('keepry_png', 'marketing/campaigns/pinterest/K01_keepry_pinterest_2x3.png', b'\x89PNG'),
            ('astramate_v2_mp4', 'marketing/previews/astramate_v2_neural_voice_music_PREVIEW.mp4', b'ftyp'),
            ('keepry_v2_mp4', 'marketing/previews/keepry_v2_neural_voice_music_PREVIEW.mp4', b'ftyp'),
          ]
          ok=True
          for label, path, sig in paths:
            url='https://www.astralabsph.com/'+path
            try:
              req=urllib.request.Request(url,headers={'Range':'bytes=0-31','User-Agent':'AstraLabs-Public-Media-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=24) as resp:
                data=resp.read(32)
                mime=resp.headers.get('Content-Type','').split(';')[0].lower().strip()
                valid=(resp.status in (200,206) and (data[4:8]==sig if sig==b'ftyp' else data.startswith(sig)))
                valid = valid and (mime.startswith('video/') if 'mp4' in label else mime.startswith('image/'))
                print('MEDIA_CHECK',label,'HTTP',resp.status,'mime',mime,'valid',valid)
                ok = ok and valid
            except Exception as e:
              print('MEDIA_CHECK',label,'FAILED',type(e).__name__,str(e)[:80])
              ok=False
          print('MEDIA_CHECK_RESULT', 'PASS' if ok else 'PENDING')
          PY
      - name: Check TikTok channel, direct MP4 media and approved draft
        env:
          ASTRALABS_BUFFER_API_KEY: ${{ secrets.ASTRALABS_BUFFER_API_KEY }}
        run: python3 marketing/automation/tiktok/scripts/buffer_tiktok.py
