name: PIREVO Christmas Social Videos Fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pirevo-christmas-social-videos-fast.yml'
      - 'marketing/pirevo/render_christmas_social_videos.py'
      - 'public/pirevo/assets/pins/wave4-christmas/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pirevo-christmas-social-videos-fast
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install self-contained renderer dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Render 5 Christmas social videos
        run: python marketing/pirevo/render_christmas_social_videos.py
      - name: Validate videos
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find public/pirevo/assets/social/christmas-wave4 -maxdepth 1 -type f -name '*.mp4' | wc -l | tr -d ' ')"
          test "$COUNT" = "5"
          for f in public/pirevo/assets/social/christmas-wave4/*.mp4; do test -s "$f"; done
          python - <<'PY'
          import glob, imageio_ffmpeg
          files=glob.glob("public/pirevo/assets/social/christmas-wave4/*.mp4")
          assert len(files)==5
          for f in files:
              gen=imageio_ffmpeg.read_frames(f)
              meta=next(gen)
              assert tuple(meta["size"])==(1080,1920), (f,meta.get("size"))
              gen.close()
          print("PIREVO_CHRISTMAS_SOCIAL_DIMENSIONS_OK")
          PY
          echo "PIREVO_CHRISTMAS_SOCIAL_VIDEO_FAST_QA_OK count=$COUNT"
      - name: Persist videos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AstraLabs PIREVO Social Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/pirevo/assets/social/christmas-wave4
          if git diff --cached --quiet; then
            echo "NO_CHRISTMAS_VIDEO_CHANGE"
            exit 0
          fi
          git commit -m 'PIREVO: render Christmas social videos'
          git pull --rebase origin main
          git push origin HEAD:main
