# Manual automation proof: 2026-09-22
name: AstraLabs Facebook Organic Queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astralabs-facebook-queue.yml'
      - 'marketing/automation/facebook/scripts/buffer_facebook.py'
      - 'marketing/automation/facebook/scripts/buffer_facebook_content.json'
  schedule:
    - cron: '15 0 * * *'
permissions:
  contents: read
concurrency:
  group: astralabs-facebook-buffer-queue
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ASTRALABS_PUBLISH_ENABLED: 'true' # One-post API proof with confirmed Facebook post-type metadata.
    steps:
      - uses: actions/checkout@v4
      - name: Verify channel and approved drafts before changing Buffer
        env:
          ASTRALABS_BUFFER_API_KEY: ${{ secrets.ASTRALABS_BUFFER_API_KEY }}
        run: python3 marketing/automation/facebook/scripts/buffer_facebook.py
