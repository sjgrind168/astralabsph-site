name: AstraLabs Three Channel Daily Plan Regression QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'marketing/automation/shared/three_channel_daily.py'
      - 'marketing/automation/shared/test_three_channel_daily.py'
      - 'marketing/automation/shared/test_buffer_schedule_contract.py'
      - 'marketing/automation/facebook/scripts/daily_two_per_app.py'
      - '.github/workflows/astralabs-keepry-existing-video-now.yml'
      - 'marketing/automation/shared/ASTRALABS_THREE_CHANNEL_DAILY_CONFIG_20260922.json'
      - 'marketing/automation/shared/ASTRALABS_THREE_CHANNEL_APPROVED_RELEASES_20260922.json'
      - 'marketing/automation/shared/ASTRALABS_7DAY_42_CREATIVE_MANIFEST_20260923.json'
      - '.github/workflows/astralabs-three-channel-plan-qa.yml'
permissions:
  contents: read
jobs:
  test-no-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate daily Buffer slot contract, retired duplicate workflow, 42 original concepts, root-only CTA and no-request hold
        run: |
          python3 -m unittest discover -s marketing/automation/shared -p 'test_three_channel_daily.py' -v
          python3 marketing/automation/shared/three_channel_daily.py --channel tiktok
          python3 marketing/automation/shared/three_channel_daily.py --channel pinterest
