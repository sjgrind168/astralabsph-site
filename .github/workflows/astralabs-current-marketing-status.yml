name: AstraLabs Current Marketing Status Read Only
# Sep24 23:30 PHT read-only baseline before owner's three-day publishing sync; no Buffer writes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astralabs-current-marketing-status.yml'
      - 'marketing/automation/shared/current_campaign_audit.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual live and scheduled Keepry and Astramate posts without writing
        env:
          PYTHONUNBUFFERED: '1' # Read-only one-shot Buffer reconciliation; no posts created.
          ASTRALABS_BUFFER_API_KEY: ${{ secrets.ASTRALABS_BUFFER_API_KEY }}
        run: python3 marketing/automation/shared/current_campaign_audit.py


# Fresh 3-day automation reconciliation 2026-09-24 23:20 PHT.
