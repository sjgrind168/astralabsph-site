<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MerchLab — Jewelry That Defines Elegance</title>
<meta name="description" content="MerchLab curated jewelry and fashion finds. Browse current Shopee-ready stock."/>
<style>
:root{--bg:#020b1a;--panel:#061326;--panel2:#091a31;--gold:#e6b85f;--gold2:#f3d28c;--ivory:#f6f0e5;--muted:#9da9b7;--line:rgba(230,184,95,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -15%,#0b2341 0,#020b1a 45%,#010713 100%);color:var(--ivory);font-family:Inter,Arial,sans-serif}
button,input,select{font:inherit}.page{max-width:1536px;margin:0 auto}.mockup{position:relative;width:100%;line-height:0;background:#020b1a}.mockup>img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:10px;outline:none}.hotspot:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold)}.hotspot:hover{background:rgba(255,255,255,.015)}
.catalog{display:none;padding:44px clamp(18px,5vw,76px) 72px;border-top:1px solid var(--line);background:linear-gradient(180deg,#061326 0,#020b1a 100%)}.catalog.show{display:block}.catalogHead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px}.eyebrow{color:var(--gold2);font-size:11px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:10px}.catalog h2{font-family:Georgia,serif;font-size:clamp(34px,4.5vw,58px);font-weight:400;line-height:1;margin:0}.meta{color:var(--muted);margin-top:9px}.back{color:var(--gold2);background:none;border:0;cursor:pointer;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 220px auto;gap:12px;margin:24px 0}.toolbar input,.toolbar select{height:46px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#08182c;color:#fff;padding:0 14px;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:var(--gold)}.available{display:flex;align-items:center;gap:8px;color:#c4ccd6;font-size:13px;white-space:nowrap;padding:0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.chip{border:1px solid rgba(230,184,95,.28);background:#071428;color:#cbd3df;border-radius:999px;padding:9px 14px;cursor:pointer}.chip.active{background:linear-gradient(90deg,#c99b49,#f2cf86);color:#061326;border-color:transparent;font-weight:700}
.productGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.productCard{background:linear-gradient(180deg,#0a1930,#051021);border:1px solid rgba(230,184,95,.28);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s transform,.2s border-color}.productCard:hover{transform:translateY(-3px);border-color:rgba(230,184,95,.65)}.productImg{aspect-ratio:1/1;position:relative;background:#0b1726;overflow:hidden}.productImg img{width:100%;height:100%;object-fit:cover;display:block}.stock{position:absolute;right:9px;top:9px;background:rgba(3,10,21,.86);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 9px;font-size:11px;color:#fff}.stock.one{color:#f4d58d}.productInfo{padding:13px 14px 15px}.productInfo h3{font-size:14px;line-height:1.35;margin:0 0 10px;height:38px;overflow:hidden;font-weight:600}.price{color:var(--gold2);font-size:17px;font-weight:800}.cat{color:#8392a5;font-size:11px;margin-top:7px;text-transform:uppercase;letter-spacing:.08em}.load{display:block;margin:26px auto 0;padding:12px 22px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold2);cursor:pointer}
.modalBackdrop{position:fixed;inset:0;background:rgba(0,5,13,.78);backdrop-filter:blur(10px);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modalBackdrop.show{display:flex}.modal{position:relative;width:min(1120px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#07162a,#020b1a);border:1px solid rgba(230,184,95,.45);border-radius:22px;box-shadow:0 28px 90px #000}.close{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:#08182c;color:#fff;cursor:pointer;z-index:2}.modalInner{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;padding:26px}.galleryMain{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#0a1729}.galleryMain img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:8px;overflow:auto;padding-top:10px}.thumb{width:66px;height:66px;border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.2);background:#071428;padding:0;cursor:pointer}.thumb.active{border-color:var(--gold)}.thumb img{width:100%;height:100%;object-fit:cover}.detail{padding:18px 8px 8px}.detail .label{color:var(--gold2);text-transform:uppercase;letter-spacing:.16em;font-size:11px}.detail h3{font-family:Georgia,serif;font-size:clamp(30px,4vw,48px);font-weight:400;line-height:1.05;margin:12px 0}.detailPrice{font-size:26px;color:var(--gold2);font-weight:800}.detailStock{color:#c3ccd8;margin:8px 0 16px}.variants{display:flex;flex-wrap:wrap;gap:7px}.pill{border:1px solid rgba(230,184,95,.28);border-radius:999px;padding:7px 10px;color:#cfd6df;font-size:12px}.desc{white-space:pre-line;color:#aeb8c5;line-height:1.6;max-height:230px;overflow:auto;margin:18px 0}.shopee{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(90deg,#cfa04d,#f4d68f);color:#061326;font-weight:900;cursor:pointer}
.searchDialog{position:fixed;inset:0;background:rgba(0,5,13,.72);backdrop-filter:blur(8px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}.searchDialog.show{display:flex}.searchBox{width:min(680px,92vw);background:#061326;border:1px solid rgba(230,184,95,.5);border-radius:18px;padding:18px;box-shadow:0 25px 70px #000}.searchBox input{width:100%;height:54px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:#08182c;color:#fff;padding:0 16px;font-size:18px;outline:none}.searchActions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}.searchActions button{border-radius:999px;padding:10px 16px;cursor:pointer}.searchGo{border:0;background:var(--gold);color:#061326;font-weight:800}.searchCancel{border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff}
@media(max-width:900px){.productGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr}.modalInner{grid-template-columns:1fr}.catalogHead{align-items:flex-start;flex-direction:column}.page{min-width:760px}body{overflow-x:auto}.mockup{min-width:760px}.catalog{min-width:760px}}
</style>
</head>

    <button class="hotspot" aria-label="Browse our Shopee products" style="left:10.1%;top:34.8%;width:22.9%;height:5.1%" onclick="openCatalog('All')"></button>
    <!-- Category strip -->
    <button class="hotspot" aria-label="Browse Rings" style="left:4.9%;top:45.1%;width:22.0%;height:12.9%" onclick="openCatalog('Rings')"></button>
    <button class="hotspot" aria-label="Browse Earrings" style="left:27.8%;top:45.1%;width:22.0%;height:12.9%" onclick="openCatalog('Earrings')"></button>
    <button class="hotspot" aria-label="Browse Necklaces" style="left:50.1%;top:45.1%;width:22.1%;height:12.9%" onclick="openCatalog('Necklaces')"></button>
    <button class="hotspot" aria-label="Browse Bracelets" style="left:72.5%;top:45.1%;width:22.2%;height:12.9%" onclick="openCatalog('Bracelets')"></button>
    <!-- Trending row -->
    <button class="hotspot" aria-label="View all products" style="left:89.1%;top:60.4%;width:6.1%;height:3.5%" onclick="openCatalog('All')"></button>
    <button class="hotspot" aria-label="Featured necklace" style="left:4.9%;top:64.2%;width:13.7%;height:15.6%" onclick="openCatalog('Necklaces')"></button>
    <button class="hotspot" aria-label="Featured earrings" style="left:19.1%;top:64.2%;width:13.7%;height:15.6%" onclick="openCatalog('Earrings')"></button>
    <button class="hotspot" aria-label="Featured ring" style="left:33.3%;top:64.2%;width:13.7%;height:15.6%" onclick="openCatalog('Rings')"></button>
    <button class="hotspot" aria-label="Featured necklace" style="left:47.5%;top:64.2%;width:13.7%;height:15.6%" onclick="openCatalog('Necklaces')"></button>
    <button class="hotspot" aria-label="Featured earrings" style="left:61.7%;top:64.2%;width:13.7%;height:15.6%" onclick="openCatalog('Earrings')"></button>
    <button class="hotspot" aria-label="Featured bracelet" style="left:75.9%;top:64.2%;width:18.7%;height:15.6%" onclick="openCatalog('Bracelets')"></button>
    <!-- Bottom row -->
    <button class="hotspot" aria-label="Shop new arrivals" style="left:4.8%;top:82.0%;width:54.3%;height:15.5%" onclick="openNewArrivals()"></button>
    <button class="hotspot" aria-label="Explore fashion" style="left:60.0%;top:82.0%;width:34.8%;height:15.5%" onclick="openCatalog('Fashion')"></button>
  </div>

  <section class="catalog" id="catalog">
    <div class="catalogHead">
      <div>
        <div class="eyebrow">Current Shopee inventory</div>
        <h2 id="catalogTitle">Jewelry Collection</h2>
        <div class="meta" id="catalogMeta"></div>
      </div>
      <button class="back" onclick="closeCatalog()">Back to showcase ↑</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="toolbar">
      <input id="catalogSearch" placeholder="Search within this collection..." oninput="applyFilters()"/>
      <select id="sortSelect" onchange="applyFilters()"><option value="default">Featured order</option><option value="priceAsc">Price: low to high</option><option value="priceDesc">Price: high to low</option><option value="stock">Stock: available first</option></select>
      <label class="available"><input type="checkbox" id="availableOnly" checked onchange="applyFilters()"/> Available only</label>
    </div>
    <div class="productGrid" id="productGrid"></div>
    <button class="load" id="loadMore" onclick="loadMore()">Load more</button>
  </section>
</div>

<div class="modalBackdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
 <div class="modal"><button class="close" onclick="closeModal()">✕</button><div class="modalInner">
  <div><div class="galleryMain"><img id="mainImage" alt="Product image"/></div><div class="thumbs" id="thumbs"></div></div>
  <div class="detail"><div class="label" id="detailCategory"></div><h3 id="detailTitle"></h3><div class="detailPrice" id="detailPrice"></div><div class="detailStock" id="detailStock"></div><div class="variants" id="variantList"></div><div class="desc" id="detailDesc"></div><button class="shopee" id="shopeeBtn">Open this product in Shopee →</button></div>
 </div></div>
</div>
<div class="searchDialog" id="searchDialog" onclick="if(event.target===this)closeSearch()"><div class="searchBox"><input id="globalSearch" placeholder="Search MerchLab products..." onkeydown="if(event.key==='Enter')runSearch()" autofocus/><div class="searchActions"><button class="searchCancel" onclick="closeSearch()">Cancel</button><button class="searchGo" onclick="runSearch()">Search products</button></div></div></div>
<script>
const PRODUCTS = [];
const PRODUCT_FILES = ["products-1.json","products-2.json","products-3.json","products-4.json","products-5.json","products-6.json","products-7.json","products-8.json"];
let catalogReady = Promise.all(PRODUCT_FILES.map(f=>fetch(f).then(r=>r.json()))).then(parts=>{parts.forEach(p=>PRODUCTS.push(...p));return PRODUCTS;});
let currentCategory='Jewelry',specialMode=null,filtered=[],visibleCount=24;
function peso(n){return '₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0})}
function priceText(p){return p.priceMin===p.priceMax?peso(p.priceMin):`${peso(p.priceMin)}–${peso(p.priceMax)}`}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openCatalog(cat){specialMode=null;currentCategory=cat;visibleCount=24;document.getElementById('catalog').classList.add('show');document.getElementById('catalogSearch').value='';document.getElementById('sortSelect').value='default';document.getElementById('availableOnly').checked=true;updateChips();applyFilters();setTimeout(()=>document.getElementById('catalog').scrollIntoView({behavior:'smooth',block:'start'}),50)}
function openNewArrivals(){specialMode='new';currentCategory='New Arrivals';visibleCount=24;document.getElementById('catalog').classList.add('show');document.getElementById('catalogSearch').value='';document.getElementById('sortSelect').value='default';document.getElementById('availableOnly').checked=true;updateChips();applyFilters();setTimeout(()=>document.getElementById('catalog').scrollIntoView({behavior:'smooth',block:'start'}),50)}
function closeCatalog(){document.getElementById('catalog').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
function updateChips(){const options=['Jewelry','Rings','Earrings','Necklaces','Bracelets','Accessories','Fashion','All'];document.getElementById('chips').innerHTML=options.map(c=>`<button class="chip ${currentCategory===c?'active':''}" onclick="openCatalog('${c}')">${c}</button>`).join('');const title=specialMode==='new'?'New Arrivals':currentCategory==='All'?'All Shopee Products':currentCategory==='Jewelry'?'Jewelry Collection':currentCategory;document.getElementById('catalogTitle').textContent=title}
function baseForCategory(){let list=PRODUCTS.slice();if(specialMode==='new')return list.slice(0,60);if(currentCategory==='Jewelry')return list.filter(p=>p.category!=='Fashion');if(currentCategory==='All')return list;return list.filter(p=>p.category===currentCategory)}
function applyFilters(){let list=baseForCategory();const q=document.getElementById('catalogSearch').value.trim().toLowerCase();if(q)list=list.filter(p=>(p.title+' '+p.description).toLowerCase().includes(q));if(document.getElementById('availableOnly').checked)list=list.filter(p=>p.stock>0);const sort=document.getElementById('sortSelect').value;if(sort==='priceAsc')list.sort((a,b)=>a.priceMin-b.priceMin);if(sort==='priceDesc')list.sort((a,b)=>b.priceMax-a.priceMax);if(sort==='stock')list.sort((a,b)=>b.stock-a.stock);filtered=list;renderProducts()}
function renderProducts(){const shown=filtered.slice(0,visibleCount);document.getElementById('productGrid').innerHTML=shown.map(p=>`<article class="productCard" onclick="openProduct('${p.id}')"><div class="productImg"><img src="${p.cover}" alt="${esc(p.title)}" loading="lazy" referrerpolicy="no-referrer"/><div class="stock ${p.stock===1?'one':''}">${p.stock===0?'Sold out':p.stock===1?'1 available':`${p.stock} available`}</div></div><div class="productInfo"><h3>${esc(p.title)}</h3><div class="price">${priceText(p)}</div><div class="cat">${p.category}</div></div></article>`).join('');document.getElementById('catalogMeta').textContent=`Showing ${Math.min(visibleCount,filtered.length)} of ${filtered.length} products`;document.getElementById('loadMore').style.display=visibleCount<filtered.length?'block':'none'}
function loadMore(){visibleCount+=24;renderProducts()}
async function openProduct(id){await catalogReady;const p=PRODUCTS.find(x=>x.id===id);if(!p)return;document.getElementById('detailCategory').textContent=p.category;document.getElementById('detailTitle').textContent=p.title;document.getElementById('detailPrice').textContent=priceText(p);document.getElementById('detailStock').textContent=p.stock===0?'Currently sold out on Shopee':p.stock===1?'Only 1 piece available':`${p.stock} total stock across variations`;document.getElementById('detailDesc').textContent=p.description||'View full listing details on Shopee.';const imgs=p.images.length?p.images:[p.cover];document.getElementById('mainImage').src=imgs[0];document.getElementById('thumbs').innerHTML=imgs.map((src,i)=>`<button class="thumb ${i===0?'active':''}" onclick="setImage('${src}',this)"><img src="${src}" referrerpolicy="no-referrer"/></button>`).join('');document.getElementById('variantList').innerHTML=(p.variants||[]).slice(0,10).map(v=>`<span class="pill">${esc(v.name)}${v.price?' • '+peso(v.price):''}</span>`).join('');document.getElementById('shopeeBtn').onclick=()=>{const u=p.url.replace('https://shopee.ph/product/','https://shopee.ph/universal-link/product/')+(p.url.includes('?')?'&':'?')+'deep_and_web=1';window.open(u,'_blank','noopener')};document.getElementById('modalBackdrop').classList.add('show');document.body.style.overflow='hidden'}
function setImage(src,btn){document.getElementById('mainImage').src=src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show');document.body.style.overflow=''}
function openSearch(){document.getElementById('searchDialog').classList.add('show');setTimeout(()=>document.getElementById('globalSearch').focus(),50)}
function closeSearch(){document.getElementById('searchDialog').classList.remove('show')}
async function runSearch(){await catalogReady;const q=document.getElementById('globalSearch').value.trim();closeSearch();currentCategory='All';specialMode=null;visibleCount=24;document.getElementById('catalog').classList.add('show');document.getElementById('catalogSearch').value=q;document.getElementById('availableOnly').checked=true;updateChips();applyFilters();setTimeout(()=>document.getElementById('catalog').scrollIntoView({behavior:'smooth'}),50)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSearch()}})
</script>
</body></html>
