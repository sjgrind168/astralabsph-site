<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Keepry payment</title>
  <style>
    :root{--bg:#f6f8f7;--card:#fff;--ink:#17211e;--muted:#66716d;--green:#00704a;--soft:#d4e9e2;--line:#dde5e1}
    @media(prefers-color-scheme:dark){:root{--bg:#101614;--card:#17201d;--ink:#f1f6f3;--muted:#a9b5b0;--green:#00a862;--soft:#203b33;--line:#2a3934}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .card{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08);text-align:center}
    .logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px;box-shadow:0 8px 20px rgba(0,112,74,.16)}
    .brand{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--green);margin:0}
    .by{font-size:12px;color:var(--muted);margin-top:2px}
    .status{font-size:22px;font-weight:750;letter-spacing:-.02em;margin:24px 0 6px}
    .copy{margin:0;color:var(--muted)}
    .spinner{width:28px;height:28px;border:3px solid var(--soft);border-top-color:var(--green);border-radius:50%;margin:22px auto;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    button{appearance:none;border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;background:var(--green);color:#fff;width:100%;margin-top:20px;cursor:pointer}
    .foot{font-size:11px;color:var(--muted);margin-top:18px}
    .ok{color:var(--green)}
  </style>
</head>

    <h1 class="brand">Keepry</h1>
    <div class="by">by AstraLabs PH</div>
    <div id="status" class="status">Checking payment</div>
    <p id="copy" class="copy">Please keep this page open.</p>
    <p id="sub" class="copy"></p>
    <div id="spinner" class="spinner"></div>
    <button id="open" type="button">Open Keepry</button>
    <div class="foot">You can safely close this page after Keepry opens.</div>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const paymentId = params.get('payment_id') || '';
      const result = params.get('result') === 'cancel' ? 'cancel' : 'success';
      const statusEl = document.getElementById('status');
      const copyEl = document.getElementById('copy');
      const subEl = document.getElementById('sub');
      const spinner = document.getElementById('spinner');
      const open = document.getElementById('open');

      const deepLink = (status) =>
        'keepry://payment-return?payment_id=' + encodeURIComponent(paymentId) + '&status=' + status;

      const returnToKeepry = (status) => {
        location.href = deepLink(status);
      };

      open.addEventListener('click', () =>
        returnToKeepry(result === 'cancel' ? 'cancelled' : 'success'),
      );

      if (!/^[0-9a-f-]{36}$/i.test(paymentId)) {
        statusEl.textContent = 'Unable to verify payment';
        copyEl.textContent = 'This payment return link is invalid.';
        subEl.textContent = '';
        spinner.style.display = 'none';
        return;
      }

      if (result === 'cancel') {
        statusEl.textContent = 'Payment cancelled';
        copyEl.textContent = 'No Premium access was activated.';
        subEl.textContent = 'Returning you to Keepry…';
        spinner.style.display = 'none';
        setTimeout(() => returnToKeepry('cancelled'), 650);
        return;
      }

      statusEl.textContent = 'Payment received';
      copyEl.textContent = 'We’re securely confirming your Keepry Premium access.';
      subEl.textContent = 'Please keep this page open.';

      let tries = 0;
      async function poll() {
        tries += 1;
        try {
          const url = '/api/keepry-payment-status?payment_id=' + encodeURIComponent(paymentId) + '&_=' + Date.now();
          const response = await fetch(url, { cache: 'no-store', credentials: 'omit' });
          const data = await response.json();

          if (data && data.ready === true && data.paid === true && data.premium === true) {
            statusEl.textContent = 'Payment confirmed';
            statusEl.classList.add('ok');
            copyEl.textContent = 'Keepry Premium is ready.';
            subEl.textContent = 'Returning you to Keepry…';
            spinner.style.display = 'none';
            setTimeout(() => returnToKeepry('success'), 350);
            return;
          }
        } catch (_) {}

        setTimeout(poll, tries < 120 ? 250 : 1000);
      }

      poll();
    })();
  </script>
