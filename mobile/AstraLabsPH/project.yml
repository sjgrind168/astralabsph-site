name: AstraLabsPH
options:
  bundleIdPrefix: com.astralabs
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  AstraLabsPH:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AstraLabsPH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.astralabs.missioncontrol
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "AstraLabs PH"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
